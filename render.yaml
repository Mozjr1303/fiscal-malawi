services:
  # 1. Backend Express API
  - type: web
    name: sentinel-fiscal-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-fiscal-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: PAYCHANGU_PUBLIC_KEY
        sync: false
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sentinel-fiscal-frontend
          property: host
      - key: PUBLIC_TUNNEL_URL
        fromService:
          type: web
          name: sentinel-fiscal-backend
          property: host
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: sentinel-fiscal-ml
          property: host

  # 2. Python ML Anomaly Engine
  - type: web
    name: sentinel-fiscal-ml
    env: python
    plan: free
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 8001
    envVars:
      - key: PORT
        value: 8001

  # 3. React Frontend Static Site
  - type: web
    name: sentinel-fiscal-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sentinel-fiscal-backend
          property: host

databases:
  # 4. PostgreSQL Database
  - name: sentinel-fiscal-db
    plan: free
